name: Civ Final Map Numeric Balance QA

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "tile_system/FINAL_GENERIC_MAP_IMPROVEMENT_INFRASTRUCTURE_ROSTER_V1.csv"
      - "tile_system/FINAL_GENERIC_MAP_NUMERIC_BALANCE_V1.csv"
      - "tile_system/FINAL_MAP_YIELD_UPGRADE_RULES_V1.csv"
      - "tile_system/FINAL_RESOURCE_IMPROVEMENT_COMPATIBILITY_V1.csv"
      - "tile_system/FINAL_MORE_LUXURIES_RESOURCE_RULES_V1.csv"
      - "tile_system/FINAL_GENERIC_MAP_NUMERIC_BALANCE_V1.md"
      - "tile_system/FINAL_GENERIC_MAP_NUMERIC_SOURCE_AUDIT_V1.md"
      - "civ_map_stage10_resources/resource_catalog_v1.yaml"
      - "tile_system/validate_final_generic_map_numeric_balance_v1.py"
      - ".github/workflows/civ-final-map-numeric-balance-qa.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate map numeric and resource compatibility
        run: python tile_system/validate_final_generic_map_numeric_balance_v1.py
