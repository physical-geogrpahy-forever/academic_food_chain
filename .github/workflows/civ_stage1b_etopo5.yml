name: civ-stage1b-etopo5

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - 'civ_game_map_stage1b/**'
      - '.github/workflows/civ_stage1b_etopo5.yml'
  workflow_dispatch:

jobs:
  build-stage1b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests pyproj shapely rasterio geopandas pyogrio
      - name: Build ETOPO5 5-minute per-hex statistics
        run: |
          cd civ_game_map_stage1b
          python build_stage1b_etopo5_5min.py \
            --work stage1b_work \
            --out CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_STATS.csv
      - name: Package outputs
        run: |
          cd civ_game_map_stage1b
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          files=[
            Path('CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_STATS.csv'),
            Path('CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_SUMMARY.json'),
            Path('build_stage1b_etopo5_5min.py'),
          ]
          h={}
          for p in files:
            h[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('SHA256SUMS.json').write_text(json.dumps(h,indent=2),encoding='utf-8')
          files.append(Path('SHA256SUMS.json'))
          with zipfile.ZipFile('CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_ARTIFACT.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files: z.write(p,p.name)
          PY
      - name: Upload Stage 1B artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN
          path: |
            civ_game_map_stage1b/CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_STATS.csv
            civ_game_map_stage1b/CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_SUMMARY.json
            civ_game_map_stage1b/SHA256SUMS.json
            civ_game_map_stage1b/CIV_GAME_MAP_STAGE1B_ETOPO5_5MIN_ARTIFACT.zip
          if-no-files-found: error