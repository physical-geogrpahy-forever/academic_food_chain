name: CIV Stage 1B relief package

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage1b_qa/render_relief_preview.py"
      - ".github/workflows/civ-stage1b-package.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TARGET_QA_SHA: e7ae2d47818726b21ea82e248f6162320caa3938
      TARGET_QA_WORKFLOW: civ-stage1b-qa.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for final Stage 1B QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_QA_WORKFLOW}/runs?branch=civ-game-map-stage1b-etopo2022&per_page=30")
            RID=$(echo "$DATA" | jq -r --arg sha "$TARGET_QA_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
            STATUS=$(echo "$DATA" | jq -r --arg sha "$TARGET_QA_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .status' | head -1)
            CONCLUSION=$(echo "$DATA" | jq -r --arg sha "$TARGET_QA_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .conclusion' | head -1)
            echo "attempt=$i run=$RID status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              echo "QA_RUN_ID=$RID" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Download QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa
          gh run download "$QA_RUN_ID" -n CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA -D qa
          test -s qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_CLASSIFIED.csv
          cat qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA_GATE.txt

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas shapely pyogrio matplotlib

      - name: Build GPKG and previews
        run: |
          python civ_map_stage1b_qa/render_relief_preview.py             qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_CLASSIFIED.csv             --prefix CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES

      - name: Package outputs
        run: |
          cp qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA.csv .
          cp qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA_GATE.txt .
          cp qa/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SUMMARY.json .
          sha256sum CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_* > CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SHA256.txt
          zip -9 CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_PACKAGE.zip             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_LAND.gpkg             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_WORLD_PREVIEW.png             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SOUTH_AMERICA_PREVIEW.png             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_ANDES_PREVIEW.png             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SUMMARY.csv             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA.csv             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA_GATE.txt             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SUMMARY.json             CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SHA256.txt

      - name: Upload Stage 1B package
        uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_PACKAGE
          path: |
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_PACKAGE.zip
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_LAND.gpkg
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_WORLD_PREVIEW.png
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SOUTH_AMERICA_PREVIEW.png
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_ANDES_PREVIEW.png
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SUMMARY.csv
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA.csv
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_QA_GATE.txt
            CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
