name: Senate extended-history performance

on:
  push:
    branches:
      - archive-2026-us-senate-model
    paths:
      - 'senate-model-archive/experiments/history_extension/**'
      - '.github/workflows/senate-history-extension-performance.yml'

permissions:
  contents: write

concurrency:
  group: senate-history-extension-performance
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Run extended-history OOS
        run: python senate-model-archive/experiments/history_extension/run.py
      - name: Commit experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/experiments/history_extension/results senate-model-archive/docs/history/updates/2026-09-21_0230_extended-history-national-econ-oos.md
          if git diff --cached --quiet; then
            echo 'No experiment changes'
          else
            git commit -m 'perf: extended-history National economic OOS results [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi
