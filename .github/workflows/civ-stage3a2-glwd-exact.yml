name: CIV Stage 3A2 exact GLWD class fractions

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage3_wetlands/build_stage3a2_glwd_exact_classes.py"
      - ".github/workflows/civ-stage3a2-glwd-exact.yml"
  workflow_dispatch:

jobs:
  glwd_exact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STAGE2B_RUN: "35436045507"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download final Stage 2B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage2b
          gh run download "$STAGE2B_RUN" -n CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES -D stage2b
          GPKG=$(find stage2b -name 'CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF.gpkg' -o -name '*.gpkg' | head -1)
          test -n "$GPKG"
          test -s "$GPKG"
          echo "STAGE2B_GPKG=$GPKG" >> "$GITHUB_ENV"
          echo "Using $GPKG"

      - name: Download official GLWD v2 individual class percentages
        run: |
          curl -L --retry 5 --retry-delay 5             -o GLWD_v2_0_area_by_class_pct_tif.zip             https://ndownloader.figshare.com/files/54001775
          echo "1c48076c4b16c9ed80eecf243e954a1e  GLWD_v2_0_area_by_class_pct_tif.zip" | md5sum -c -
          sha256sum GLWD_v2_0_area_by_class_pct_tif.zip | tee GLWD_CLASS_PCT_SHA256.txt

      - name: Install geospatial stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas geopandas shapely pyproj pyogrio rasterio exactextract

      - name: Aggregate exact class fractions to LAND hexes
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v python civ_map_stage3_wetlands/build_stage3a2_glwd_exact_classes.py             "$STAGE2B_GPKG"             GLWD_v2_0_area_by_class_pct_tif.zip             --work stage3a2_work             --prefix CIV_GAME_MAP_STAGE3A2_GLWD_EXACT             2>&1 | tee CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_RUN.log

      - name: Package compact outputs
        run: |
          zip -9 CIV_GAME_MAP_STAGE3A2_GLWD_EXACT.zip             CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_HEX_STATS.csv             CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_CATEGORY_AUDIT.json             CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_README.json             CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_RUN.log             GLWD_CLASS_PCT_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE3A2_GLWD_EXACT
          path: |
            CIV_GAME_MAP_STAGE3A2_GLWD_EXACT.zip
            CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_HEX_STATS.csv
            CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_CATEGORY_AUDIT.json
            CIV_GAME_MAP_STAGE3A2_GLWD_EXACT_README.json
          if-no-files-found: error
          retention-days: 30
