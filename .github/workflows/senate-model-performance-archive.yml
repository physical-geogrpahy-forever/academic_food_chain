name: Senate model performance archive runner

on:
  push:
    branches:
      - archive-2026-us-senate-model
    paths:
      - 'senate-model-archive/performance/**'
      - '.github/workflows/senate-model-performance-archive.yml'

permissions:
  contents: write

concurrency:
  group: senate-model-performance-archive
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pyyaml
      - name: Run performance pipeline
        run: python senate-model-archive/performance/run_performance.py
      - name: Commit performance outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/performance/results senate-model-archive/docs/history/updates
          if git diff --cached --quiet; then
            echo 'No performance changes'
          else
            git commit -m 'perf: refresh Senate OOS performance results [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi