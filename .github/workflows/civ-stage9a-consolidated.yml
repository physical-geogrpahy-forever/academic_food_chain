name: CIV Stage 9A consolidated audit

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage9_consolidate/build_stage9a_consolidated.py"
      - ".github/workflows/civ-stage9a-consolidated.yml"
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STAGE8_RUN: "35439388295"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Stage 8A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 540); do
            D=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE8_RUN}")
            S=$(echo "$D" | jq -r .status)
            C=$(echo "$D" | jq -r .conclusion)
            echo "attempt=$i status=$S conclusion=$C"
            if [ "$S" = "completed" ]; then
              test "$C" = "success"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Download Stage 8A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage8
          gh run download "$STAGE8_RUN" -n CIV_GAME_MAP_STAGE8A_OASIS -D stage8
          test -s stage8/CIV_GAME_MAP_STAGE8A_OASIS.gpkg

      - name: Install geospatial stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas shapely pyproj pyogrio

      - name: Consolidate and audit
        run: |
          python civ_map_stage9_consolidate/build_stage9a_consolidated.py             stage8/CIV_GAME_MAP_STAGE8A_OASIS.gpkg             --prefix CIV_GAME_MAP_STAGE9A_CONSOLIDATED             | tee CIV_GAME_MAP_STAGE9A_CONSOLIDATED_RUN.log

      - name: Package
        run: |
          sha256sum CIV_GAME_MAP_STAGE9A_CONSOLIDATED* > CIV_GAME_MAP_STAGE9A_SHA256.txt
          zip -9 CIV_GAME_MAP_STAGE9A_CONSOLIDATED_PACKAGE.zip             CIV_GAME_MAP_STAGE9A_CONSOLIDATED.gpkg             CIV_GAME_MAP_STAGE9A_CONSOLIDATED_AUDIT.csv             CIV_GAME_MAP_STAGE9A_CONSOLIDATED_FEATURE_CONFLICTS.csv             CIV_GAME_MAP_STAGE9A_CONSOLIDATED_SUMMARY.json             CIV_GAME_MAP_STAGE9A_CONSOLIDATED_RUN.log             CIV_GAME_MAP_STAGE9A_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE9A_CONSOLIDATED
          path: |
            CIV_GAME_MAP_STAGE9A_CONSOLIDATED_PACKAGE.zip
            CIV_GAME_MAP_STAGE9A_CONSOLIDATED.gpkg
            CIV_GAME_MAP_STAGE9A_CONSOLIDATED_AUDIT.csv
            CIV_GAME_MAP_STAGE9A_CONSOLIDATED_FEATURE_CONFLICTS.csv
            CIV_GAME_MAP_STAGE9A_CONSOLIDATED_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
