name: Civ Full Repository Static Audit

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - 'tools/audit_civ_repository_v1.py'
      - '.github/workflows/civ-full-repository-static-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative Civ branch
        uses: actions/checkout@v4
        with:
          ref: civ-game-map-stage1b-etopo2022
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Execute read-only full repository audit
        run: python tools/audit_civ_repository_v1.py
      - name: Upload audit reports (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ-full-repository-audit
          path: |
            audit-output/full_audit.json
            audit-output/full_audit.md
          if-no-files-found: warn
