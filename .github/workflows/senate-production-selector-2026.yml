name: Senate 2026 production selector
on:
  push:
    branches: [archive-2026-us-senate-model]
    paths:
      - 'senate-model-archive/experiments/production_selector_2026/**'
      - '.github/workflows/senate-production-selector-2026.yml'
permissions:
  contents: write
concurrency:
  group: senate-production-selector-2026
  cancel-in-progress: true
jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python senate-model-archive/experiments/production_selector_2026/run.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/experiments/production_selector_2026/results senate-model-archive/config/core_v2r_direction_2026_production.json senate-model-archive/docs/history/updates/2026-09-21_0520_production-selector-2026.md
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'model: fit 2026 production direction selector [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase --autostash origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi
