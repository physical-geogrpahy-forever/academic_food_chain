name: CIV Stage 10 decorative minerals Q

on:
  workflow_dispatch:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage10_resources/trigger_stage10q.txt"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas geopandas pyogrio shapely

      - name: Download Stage 10P board
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/p
          gh api /repos/physical-geogrpahy-forever/academic_food_chain/actions/artifacts/10585905183/zip > input/p.zip
          unzip -q input/p.zip -d input/p
          BOARD="$(find input/p -type f -name 'CIV_GAME_MAP_STAGE10P_MRDS_NONSTRATEGIC.gpkg' | head -1)"
          test -n "$BOARD"
          echo "BOARD=$BOARD" >> "$GITHUB_ENV"

      - name: Add jade amber lapis evidence
        run: |
          python civ_map_stage10_resources/build_stage10q_decorative_minerals.py             "$BOARD"             civ_map_stage10_resources/decorative_mineral_sources_v1.csv             --layer game_map_stage10p_mrds_nonstrategic             --prefix CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS

      - name: Audit
        run: cat CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS_SUMMARY.json

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS
          path: |
            CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS.gpkg
            CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS_LAND_EVIDENCE.csv
            CIV_GAME_MAP_STAGE10Q_DECORATIVE_MINERALS_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
