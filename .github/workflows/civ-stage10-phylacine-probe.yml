name: CIV Stage 10 PHYLACINE probe

on:
  workflow_dispatch:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage10_resources/trigger_phylacine_probe.txt"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download PHYLACINE v1.2.1 official GitHub release
        run: |
          set -euo pipefail
          mkdir -p phylacine_probe
          curl -L --fail --retry 4             "https://github.com/MegaPast2Future/PHYLACINE_1.2/releases/download/v1.2.1/PHYLACINE_1.2.1.zip"             -o phylacine_probe/PHYLACINE_1.2.1.zip
          ls -lh phylacine_probe/PHYLACINE_1.2.1.zip
          unzip -Z1 phylacine_probe/PHYLACINE_1.2.1.zip             | grep -Ei 'Present_natural|Spatial_metadata|Trait_data|Synonym'             | head -300 | tee phylacine_probe/structure.txt
          unzip -Z1 phylacine_probe/PHYLACINE_1.2.1.zip | grep -Ei             'Present_natural/.+(Bison|Elephas|Loxodonta|Cervus|Odocoileus|Rangifer|Alces|Dama|Capreolus|Martes|Mustela|Vulpes|Castor|Lutra|Enhydra|Meles|Neovison|Gulo)'             | head -500 | tee phylacine_probe/target_files.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_STAGE10_PHYLACINE_PROBE
          path: |
            phylacine_probe/structure.txt
            phylacine_probe/target_files.txt
          if-no-files-found: error
          retention-days: 30
