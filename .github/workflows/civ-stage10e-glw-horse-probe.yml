name: CIV Stage 10E GLW horse source probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Query Harvard Dataverse GLW4_2015 dataset
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=doi:10.7910/DVN/JJGCTX"
          curl -L --fail --retry 5 --retry-delay 2 "$URL" -o GLW4_2015_DATASET.json
          jq -r '.data.latestVersion.files[] | [.dataFile.id,.label,.dataFile.filesize,.dataFile.contentType] | @tsv'             GLW4_2015_DATASET.json | tee GLW4_2015_FILES.tsv
          grep -E '5_Ho_2015_Da\.tif' GLW4_2015_FILES.tsv | tee GLW4_2015_HORSE_FILES.tsv
          test -s GLW4_2015_HORSE_FILES.tsv

      - name: Download first horse raster and inspect
        shell: bash
        run: |
          set -euo pipefail
          ID=$(head -1 GLW4_2015_HORSE_FILES.tsv | cut -f1)
          curl -L --fail --retry 5 --retry-delay 2             -o glw3_horse.dat             "https://dataverse.harvard.edu/api/access/datafile/$ID"
          file glw3_horse.dat | tee GLW4_2015_HORSE_FILETYPE.txt
          sha256sum glw3_horse.dat | tee GLW4_2015_HORSE_SHA256.txt
          ls -lh glw3_horse.dat

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE10E_GLW_HORSE_PROBE
          path: |
            GLW4_2015_FILES.tsv
            GLW4_2015_HORSE_FILES.tsv
            GLW4_2015_HORSE_FILETYPE.txt
            GLW4_2015_HORSE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
