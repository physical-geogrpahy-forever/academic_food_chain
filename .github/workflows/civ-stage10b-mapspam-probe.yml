name: CIV Stage 10B MAPSPAM resource probe

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage10_resources/probe_mapspam_resources.py"
      - ".github/workflows/civ-stage10b-mapspam-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install raster tools
        run: python -m pip install --upgrade rasterio

      - name: Probe MAPSPAM 2020 v2r2 global COG
        run: |
          python civ_map_stage10_resources/probe_mapspam_resources.py             "https://digital-atlas.s3.amazonaws.com/cdh/data/mapspam2020-v2r2/cog/spam2020-all-physical_area.tif"             --prefix CIV_GAME_MAP_STAGE10B_MAPSPAM_PROBE             | tee CIV_GAME_MAP_STAGE10B_MAPSPAM_PROBE_RUN.log

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE10B_MAPSPAM_PROBE
          path: |
            CIV_GAME_MAP_STAGE10B_MAPSPAM_PROBE_SUMMARY.json
            CIV_GAME_MAP_STAGE10B_MAPSPAM_PROBE_RUN.log
            MAPSPAM_OBJECTS.txt
          if-no-files-found: error
          retention-days: 30
