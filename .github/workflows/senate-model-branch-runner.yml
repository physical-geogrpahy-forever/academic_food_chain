name: Senate model branch runner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'senate-model-archive/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: senate-model-archive
  cancel-in-progress: true

jobs:
  run-senate-archive:
    if: github.head_ref == 'archive-2026-us-senate-model'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run archive pipeline
        run: python senate-model-archive/scripts/run_pipeline.py

      - name: Commit generated outputs and worklogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/data/processed senate-model-archive/docs/history/updates senate-model-archive/config
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'data: refresh Senate archive pipeline outputs [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi