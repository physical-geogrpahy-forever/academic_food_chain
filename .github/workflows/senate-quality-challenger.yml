name: Senate QualityChallenger direction

on:
  push:
    branches:
      - archive-2026-us-senate-model
    paths:
      - 'senate-model-archive/experiments/quality_challenger/**'
      - '.github/workflows/senate-quality-challenger.yml'

permissions:
  contents: write

concurrency:
  group: senate-quality-challenger
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python senate-model-archive/experiments/quality_challenger/run.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/experiments/quality_challenger/results senate-model-archive/docs/history/updates/2026-09-21_0440_quality-challenger-state-office-direction.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'perf: QualityChallenger state-office OOS results [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase --autostash origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi
