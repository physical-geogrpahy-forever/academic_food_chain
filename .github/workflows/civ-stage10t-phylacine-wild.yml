name: CIV Stage 10 wild mammals T

on:
  workflow_dispatch:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage10_resources/trigger_stage10t.txt"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas geopandas pyogrio shapely rasterio exactextract

      - name: Download Stage 10R board
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/r
          gh api /repos/physical-geogrpahy-forever/academic_food_chain/actions/artifacts/10586421014/zip > input/r.zip
          unzip -q input/r.zip -d input/r
          BOARD="$(find input/r -type f -name 'CIV_GAME_MAP_STAGE10R_GLW_LIVESTOCK.gpkg' | head -1)"
          test -n "$BOARD"
          echo "BOARD=$BOARD" >> "$GITHUB_ENV"

      - name: Download official PHYLACINE v1.2.1 release
        run: |
          curl -L --fail --retry 4             "https://github.com/MegaPast2Future/PHYLACINE_1.2/releases/download/v1.2.1/PHYLACINE_1.2.1.zip"             -o input/PHYLACINE_1.2.1.zip
          ls -lh input/PHYLACINE_1.2.1.zip

      - name: Aggregate wild mammal evidence
        run: |
          python civ_map_stage10_resources/build_stage10t_phylacine_wild.py             "$BOARD" input/PHYLACINE_1.2.1.zip             --layer game_map_stage10r_glw_livestock             --prefix CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD

      - name: Audit
        run: cat CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD_SUMMARY.json

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD
          path: |
            CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD.gpkg
            CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD_LAND_EVIDENCE.csv
            CIV_GAME_MAP_STAGE10T_PHYLACINE_WILD_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
