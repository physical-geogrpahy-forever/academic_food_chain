name: Senate model Generic Ballot performance

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: senate-model-generic-ballot-performance
  cancel-in-progress: true

jobs:
  generic-ballot-oos:
    if: github.event.pull_request.head.ref == 'senate-perf-generic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: senate-perf-generic
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run generic-ballot rolling OOS
        run: python senate-model-archive/performance/run_generic_ballot_oos.py