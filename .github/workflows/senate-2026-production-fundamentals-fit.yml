name: Fit 2026 production fundamentals coefficients
on:
  push:
    branches: [archive-2026-us-senate-model]
    paths:
      - 'senate-model-archive/scripts/fit_2026_production_fundamentals.py'
      - '.github/workflows/senate-2026-production-fundamentals-fit.yml'
permissions:
  contents: write
concurrency:
  group: senate-2026-production-fundamentals-fit
  cancel-in-progress: true
jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python senate-model-archive/scripts/fit_2026_production_fundamentals.py
      - name: Commit frozen fit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/data/snapshots/2026_production_fundamentals_coefficients.csv \
                  senate-model-archive/data/snapshots/2026_production_fundamentals_standardization.csv \
                  senate-model-archive/data/snapshots/2026_production_fundamentals_fit_meta.json \
                  senate-model-archive/docs/analysis/2026_PRODUCTION_FUNDAMENTALS_FIT.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'model: freeze 2026 production fundamentals fit [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase --autostash origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi
