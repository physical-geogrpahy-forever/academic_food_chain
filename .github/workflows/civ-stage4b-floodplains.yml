name: CIV Stage 4B Flood Plains

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage4_rivers/build_stage4b_floodplains.py"
      - ".github/workflows/civ-stage4b-floodplains.yml"
  workflow_dispatch:

jobs:
  floodplains:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STAGE4A_RUN: "35437847516"
      STAGE3A3_RUN: "35437561915"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for RID in "$STAGE4A_RUN" "$STAGE3A3_RUN"; do
            for i in $(seq 1 360); do
              DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RID}")
              STATUS=$(echo "$DATA" | jq -r .status)
              CONCLUSION=$(echo "$DATA" | jq -r .conclusion)
              echo "run=$RID attempt=$i status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                test "$CONCLUSION" = "success"
                break
              fi
              sleep 10
            done
          done

      - name: Download Stage 4A river map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage4a
          gh run download "$STAGE4A_RUN" -n CIV_GAME_MAP_STAGE4A_RIVERS -D stage4a
          test -s stage4a/CIV_GAME_MAP_STAGE4A_RIVERS.gpkg

      - name: Download GLWD subtype diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p glwd
          gh run download "$STAGE3A3_RUN" -n CIV_GAME_MAP_STAGE3A3_GLWD_DIAG -D glwd
          test -s glwd/CIV_GAME_MAP_STAGE3A3_GLWD_DIAG_HEX_STATS.csv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas geopandas shapely pyproj pyogrio

      - name: Build Flood Plains
        run: |
          python civ_map_stage4_rivers/build_stage4b_floodplains.py             stage4a/CIV_GAME_MAP_STAGE4A_RIVERS.gpkg             glwd/CIV_GAME_MAP_STAGE3A3_GLWD_DIAG_HEX_STATS.csv             --prefix CIV_GAME_MAP_STAGE4B_FLOODPLAINS             | tee CIV_GAME_MAP_STAGE4B_FLOODPLAINS_RUN.log

      - name: Package
        run: |
          sha256sum CIV_GAME_MAP_STAGE4B_FLOODPLAINS* > CIV_GAME_MAP_STAGE4B_SHA256.txt
          zip -9 CIV_GAME_MAP_STAGE4B_FLOODPLAINS_PACKAGE.zip             CIV_GAME_MAP_STAGE4B_FLOODPLAINS.gpkg             CIV_GAME_MAP_STAGE4B_FLOODPLAINS_LAND.csv             CIV_GAME_MAP_STAGE4B_FLOODPLAINS_THRESHOLD_SCAN.csv             CIV_GAME_MAP_STAGE4B_FLOODPLAINS_REGIONAL_QA.csv             CIV_GAME_MAP_STAGE4B_FLOODPLAINS_SUMMARY.json             CIV_GAME_MAP_STAGE4B_FLOODPLAINS_RUN.log             CIV_GAME_MAP_STAGE4B_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE4B_FLOODPLAINS
          path: |
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS_PACKAGE.zip
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS.gpkg
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS_LAND.csv
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS_THRESHOLD_SCAN.csv
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS_REGIONAL_QA.csv
            CIV_GAME_MAP_STAGE4B_FLOODPLAINS_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
