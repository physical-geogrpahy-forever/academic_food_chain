name: CIV Stage 2B biomes high-res relief

on:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage2b/**"
      - ".github/workflows/civ-stage2b-biomes.yml"
  workflow_dispatch:

jobs:
  stage2b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: a609714dec4f5cbbecc1c24d59c93aebbd5504c8
      TARGET_WORKFLOW: civ-stage1b-package.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find final Stage 1B package run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=civ-game-map-stage1b-etopo2022&per_page=30")
          RID=$(echo "$DATA" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success") | .id' | head -1)
          test -n "$RID"
          echo "STAGE1B_RUN_ID=$RID" >> "$GITHUB_ENV"
          echo "Stage1B run $RID"

      - name: Download Stage 1B relief package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage1b
          gh run download "$STAGE1B_RUN_ID" -n CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_PACKAGE -D stage1b
          test -s stage1b/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_LAND.gpkg

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas geopandas shapely pyproj pyogrio matplotlib

      - name: Rebuild Stage 2B terrain and features
        run: |
          python civ_map_stage2b/build_stage2b_land.py             stage1b/CIV_GAME_MAP_STAGE1B_RELIEF_HIGHRES_LAND.gpkg             --prefix CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND             | tee CIV_GAME_MAP_STAGE2B_RUN.log

      - name: Package outputs
        run: |
          sha256sum CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND* > CIV_GAME_MAP_STAGE2B_SHA256.txt
          zip -9 CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_PACKAGE.zip             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND.gpkg             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_SUMMARY.csv             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_QA.csv             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_AUDIT.json             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_WORLD_PREVIEW.png             CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_SOUTH_AMERICA_PREVIEW.png             CIV_GAME_MAP_STAGE2B_RUN.log             CIV_GAME_MAP_STAGE2B_SHA256.txt

      - name: Upload Stage 2B artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND
          path: |
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_PACKAGE.zip
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND.gpkg
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_SUMMARY.csv
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_QA.csv
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_AUDIT.json
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_WORLD_PREVIEW.png
            CIV_GAME_MAP_STAGE2B_BIOMES_HIGHRES_RELIEF_LAND_SOUTH_AMERICA_PREVIEW.png
          if-no-files-found: error
          retention-days: 30
