name: CIV Stage 10 consolidate crop refresh X0

on:
  workflow_dispatch:
  push:
    branches:
      - civ-game-map-stage1b-etopo2022
    paths:
      - "civ_map_stage10_resources/trigger_stage10x0.txt"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas geopandas pyogrio shapely
      - name: Download downstream Stage 10W and latest Stage 10N/O
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/w input/no
          gh api /repos/physical-geogrpahy-forever/academic_food_chain/actions/artifacts/10586472788/zip > input/w.zip
          unzip -q input/w.zip -d input/w
          gh api /repos/physical-geogrpahy-forever/academic_food_chain/actions/artifacts/10586450431/zip > input/no.zip
          unzip -q input/no.zip -d input/no
          WBOARD="$(find input/w -type f -name 'CIV_GAME_MAP_STAGE10W_MANUAL_LUXURIES.gpkg' | head -1)"
          CROPBOARD="$(find input/no -type f -name 'CIV_GAME_MAP_STAGE10O_MONFREDA_EVIDENCE.gpkg' | head -1)"
          test -n "$WBOARD"
          test -n "$CROPBOARD"
          echo "WBOARD=$WBOARD" >> "$GITHUB_ENV"
          echo "CROPBOARD=$CROPBOARD" >> "$GITHUB_ENV"
      - name: Consolidate latest crop evidence
        run: |
          python civ_map_stage10_resources/build_stage10x0_consolidate_crop_refresh.py             "$WBOARD" "$CROPBOARD"             --downstream-layer game_map_stage10w_manual_luxuries             --crop-layer game_map_stage10o_monfreda_evidence             --prefix CIV_GAME_MAP_STAGE10X0_CONSOLIDATED_EVIDENCE
      - name: Audit
        run: cat CIV_GAME_MAP_STAGE10X0_CONSOLIDATED_EVIDENCE_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: CIV_GAME_MAP_STAGE10X0_CONSOLIDATED_EVIDENCE
          path: |
            CIV_GAME_MAP_STAGE10X0_CONSOLIDATED_EVIDENCE.gpkg
            CIV_GAME_MAP_STAGE10X0_CONSOLIDATED_EVIDENCE_SUMMARY.json
          if-no-files-found: error
          retention-days: 30
