name: Build 2026 candidate and finance matrix
on:
  push:
    branches: [archive-2026-us-senate-model]
    paths:
      - 'senate-model-archive/scripts/build_2026_candidate_finance_matrix.py'
      - '.github/workflows/senate-2026-candidate-finance.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-2026-us-senate-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - run: python senate-model-archive/scripts/build_2026_candidate_finance_matrix.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-model-archive/data/snapshots/2026_personal_vote_core.csv senate-model-archive/data/snapshots/2026_fec_june30_top50.csv senate-model-archive/data/snapshots/2026_fec_june30_match_review.csv senate-model-archive/data/snapshots/2026_fec_june30_source_meta.csv senate-model-archive/data/snapshots/2026_candidate_pid_match_audit.csv senate-model-archive/data/snapshots/2026_production_input_matrix_45d.csv senate-model-archive/docs/analysis/2026_PRODUCTION_INPUT_MATRIX_45D.md
          if git diff --cached --quiet; then echo nochanges; else
            git commit -m 'data: complete 2026 production input matrix [skip ci]'
            git fetch origin archive-2026-us-senate-model
            git rebase --autostash origin/archive-2026-us-senate-model
            git push origin HEAD:archive-2026-us-senate-model
          fi
