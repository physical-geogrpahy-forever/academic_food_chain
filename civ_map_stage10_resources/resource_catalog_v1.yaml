excluded:
  - {id: NUTMEG, reason: merged_into_SPICES}
  - {id: CLOVES, reason: merged_into_SPICES}
  - {id: PEPPER, reason: merged_into_SPICES}
  - {id: JEWELRY, reason: processed_good}
  - {id: PORCELAIN, reason: processed_good}
  - {id: GLASS, reason: processed_good}
  - {id: CIV6_OTHER_RESOURCES, reason: excluded_by_design_except_NITER_MAIZE_RICE}
